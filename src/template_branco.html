<title>Radar Urbano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Manrope:wght@300;400;500;600&display=swap">
<style>
/* Radar Urbano — edição branca. Apple no ar e no ritmo; maison de luxo na tipografia; tecnologia só no acabamento. */
:root{
  --bg:#FFFFFF;--bg-2:#F5F5F7;--bg-3:#EDEDF0;--dark:#0B0B0C;--dark-2:#151517;
  --ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#A1A1A6;--line:rgba(0,0,0,.09);--line-2:rgba(0,0,0,.16);
  --em:#0B7A55;--em-soft:rgba(11,122,85,.08);--em-light:#37C48E;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--em);color:#fff}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--em);outline-offset:3px}
p{margin:0}
strong{font-weight:600}
h2,h3{margin:0;font-weight:500}

/* chrome */
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--em);z-index:70}
.bar{position:fixed;top:0;left:0;right:0;height:60px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,48px);background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid transparent;transition:border-color .4s}
.bar.on{border-bottom-color:var(--line)}
.wm{display:flex;align-items:center;gap:12px;font-size:11.5px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--ink)}
.wm svg{width:18px;height:18px}
.wm svg circle{fill:none;stroke:var(--ink);stroke-width:.9}
.ix-btn{display:flex;align-items:center;gap:12px;background:none;border:1px solid var(--line-2);color:var(--ink);font-family:var(--sans);font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:10px 16px;border-radius:999px;cursor:pointer;transition:background .3s,border-color .3s}
.ix-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.ix-btn i{display:block;width:16px;height:9px;position:relative}
.ix-btn i::before,.ix-btn i::after{content:"";position:absolute;left:0;right:0;height:1px;background:currentColor;transition:transform .4s var(--ease),top .4s var(--ease)}
.ix-btn i::before{top:0}.ix-btn i::after{top:8px}
body.ix .ix-btn i::before{top:4px;transform:rotate(45deg)}body.ix .ix-btn i::after{top:4px;transform:rotate(-45deg)}

/* índice em tela cheia */
.ix{position:fixed;inset:0;z-index:58;background:rgba(255,255,255,.86);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);opacity:0;pointer-events:none;transition:opacity .5s var(--ease);overflow-y:auto;padding:110px clamp(20px,6vw,96px) 80px}
body.ix .ix{opacity:1;pointer-events:auto}
.ix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 48px;max-width:1400px;margin:0 auto}
.ix-c{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px;display:flex;gap:12px;align-items:baseline}
.ix-r{font-family:var(--serif);font-size:20px;color:var(--ink);letter-spacing:0}
.ix-g a{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:8px 0;color:var(--ink-2);font-size:13.5px;line-height:1.35;border-top:1px solid var(--line);transition:color .2s;opacity:0;transform:translateY(8px)}
body.ix .ix-g a{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .6s var(--ease),color .2s}
.ix-g a i{font-style:normal;font-family:var(--serif);font-size:14px;color:var(--ink-3)}
.ix-g a:hover,.ix-g a.on{color:var(--ink)}
.ix-g a.on i{color:var(--em)}
.ix-g a span{text-transform:none;letter-spacing:0}

/* capa */
.cover{padding:clamp(150px,20vh,240px) clamp(20px,6vw,96px) clamp(90px,12vh,150px);position:relative;max-width:1400px;margin:0 auto}
.cover .k{font-size:11px;letter-spacing:.44em;text-transform:uppercase;color:var(--ink-2);margin-bottom:38px}
.cover h1{font-family:var(--sans);font-weight:500;font-size:clamp(28px,4.4vw,64px);line-height:1.12;letter-spacing:.03em;text-transform:uppercase;margin:0;max-width:22ch;text-wrap:balance}
.cover h1 .l{display:block;overflow:hidden}.cover h1 .l span{display:block}
.cover .sub{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(20px,2vw,29px);line-height:1.45;color:var(--ink-2);max-width:56ch;margin:44px 0 0;text-wrap:pretty}
.cover .rule{height:1px;width:0;background:var(--ink);margin-top:56px;transition:width 1.8s var(--ease)}
.cover .hint{margin-top:60px;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:16px}
.cover .hint b{display:block;width:1px;height:36px;background:var(--ink-3);animation:cai 2.6s var(--ease) infinite}
@keyframes cai{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.cover .arcs{position:absolute;right:clamp(-120px,-4vw,0px);top:50%;transform:translateY(-50%);width:min(44vw,560px);aspect-ratio:1;pointer-events:none}
.cover .arcs circle{fill:none;stroke:var(--ink);stroke-width:.7;vector-effect:non-scaling-stroke}
.a1{opacity:.22}.a2{opacity:.14}.a3{opacity:.09}.a4{opacity:.05}
@media (max-width:900px){.cover .arcs{display:none}}

/* capítulos */
.cap{padding:clamp(90px,12vh,150px) clamp(20px,6vw,96px) clamp(30px,4vh,50px);border-top:1px solid var(--line)}
.cap .wrap{max-width:1400px;margin:0 auto;display:flex;align-items:baseline;gap:28px;flex-wrap:wrap}
.cap-r{font-family:var(--serif);font-size:clamp(44px,6vw,84px);line-height:1;color:var(--ink);letter-spacing:.02em}
.cap-n{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink)}
.cap-s{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}

/* seções */
.sec{padding:clamp(80px,11vh,140px) clamp(20px,6vw,96px)}
.sec.alt{background:var(--bg-2)}
.sec .wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,5vw,96px);align-items:start}
.hd{position:sticky;top:96px}
.eyebrow{font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--ink-3);margin-bottom:22px}
.eyebrow span{margin:0 10px;color:var(--line-2)}
h2{font-size:clamp(21px,2.2vw,32px);line-height:1.25;letter-spacing:.03em;text-transform:uppercase;font-weight:500;color:var(--ink);text-wrap:balance}
.intro{font-size:clamp(18px,1.35vw,21px);line-height:1.6;color:var(--ink);max-width:62ch;margin-bottom:8px;text-wrap:pretty}
.intro+.intro{margin-top:18px}
.bd>.intro+.rows,.bd>.intro+.kpis,.bd>.intro+.prods,.bd>.intro+.tl,.bd>.intro+.mani{margin-top:40px}

/* linhas numeradas */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:56px 1fr;gap:20px;padding:30px 0;border-top:1px solid var(--line)}
.rows li:last-child{border-bottom:1px solid var(--line)}
.num{font-family:var(--serif);font-size:22px;line-height:1;color:var(--ink-3);padding-top:4px;transition:color .3s}
.rows li:hover .num{color:var(--em)}
.rows h3{font-size:17px;font-weight:600;letter-spacing:.01em;margin-bottom:8px;color:var(--ink)}
.rows p{color:var(--ink-2);font-size:16.5px;line-height:1.6;max-width:62ch}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:30px 28px 28px;transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.sec.alt .kpi{border-color:transparent}
.kpi:hover{transform:translateY(-4px);box-shadow:0 30px 60px -36px rgba(0,0,0,.25)}
.k-lab{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px}
.k-big{font-family:var(--serif);font-weight:400;font-size:clamp(36px,3.6vw,52px);line-height:1;color:var(--ink);letter-spacing:.01em;font-variant-numeric:tabular-nums;margin-bottom:18px}
.kpi p{font-size:15px;color:var(--ink-2);line-height:1.55}

/* produtos */
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.prod{background:var(--bg);border-radius:22px;padding:28px 26px 24px;border:1px solid transparent;display:flex;flex-direction:column;gap:10px;transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.sec:not(.alt) .prod{border-color:var(--line)}
.prod:hover{transform:translateY(-4px);box-shadow:0 30px 60px -36px rgba(0,0,0,.25)}
.p-n{font-family:var(--serif);font-size:20px;color:var(--ink-3)}
.prod h3{font-size:17px;font-weight:600}
.prod p{font-size:15px;color:var(--ink-2);line-height:1.55;flex:1}
.p-foot{font-size:12.5px;letter-spacing:.02em;color:var(--em);padding-top:14px;border-top:1px solid var(--line);margin-top:6px}
.band{margin-top:14px;background:var(--ink);color:#fff;border-radius:22px;padding:30px 32px;display:flex;flex-wrap:wrap;gap:8px 40px;align-items:baseline}
.b-lab{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.band p{font-size:clamp(18px,1.6vw,24px);font-family:var(--serif);color:#fff}
.band p strong{font-weight:400;color:var(--em-light)}

/* estágios (escuro) */
.sec.dark{background:var(--dark);color:#F5F5F7}
.sec.dark .eyebrow{color:rgba(255,255,255,.4)}.sec.dark .eyebrow span{color:rgba(255,255,255,.15)}
.sec.dark h2{color:#F5F5F7}
.sec.dark .k-lab{color:rgba(255,255,255,.42)}
.sec.dark .intro{color:rgba(255,255,255,.78)}
.est p{font-size:clamp(17px,1.25vw,19px);color:rgba(255,255,255,.78);line-height:1.6;max-width:60ch}
.fin{margin-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.f-row{display:flex;justify-content:space-between;gap:24px;align-items:baseline;padding:17px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:16px;color:rgba(255,255,255,.72)}
.f-row b{font-family:var(--serif);font-weight:400;font-size:20px;color:#F5F5F7;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.01em}
.f-row.neg b{color:rgba(255,255,255,.55)}
.f-row.soma{color:#F5F5F7}.f-row.soma b{color:var(--em-light)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:28px}
.r-card{background:var(--dark-2);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:30px 30px 26px}
.r-big{font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.4vw,50px);line-height:1.05;color:var(--em-light);font-variant-numeric:tabular-nums;letter-spacing:.005em}
.r-card.val .r-big{color:#F5F5F7}
.r-note{margin-top:12px;font-style:italic;color:rgba(255,255,255,.55);font-size:15px}

/* linha do tempo */
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px;position:relative;padding-top:26px}
.tl::before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:var(--line-2)}
.tl-i{position:relative}
.tl-dot{position:absolute;top:-26px;left:0;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1px solid var(--ink);transform:translateY(0)}
.tl-i:hover .tl-dot{background:var(--em);border-color:var(--em)}
.tl-lab{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin-bottom:12px}
.tl p{font-size:15.5px;color:var(--ink-2);line-height:1.6}

/* manifesto */
.sec.dark .mani .m-i{display:grid;grid-template-columns:56px 1fr;gap:20px;padding:34px 0;border-top:1px solid rgba(255,255,255,.12)}
.sec.dark .mani .m-i:last-child{border-bottom:1px solid rgba(255,255,255,.12)}
.sec.dark .mani .num{color:rgba(255,255,255,.35)}
.sec.dark .mani h3{font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.2vw,34px);line-height:1.15;color:#F5F5F7;margin-bottom:12px;letter-spacing:.005em}
.sec.dark .mani p{color:rgba(255,255,255,.7);font-size:16.5px;line-height:1.6;max-width:60ch}

/* fecho */
.fecho{padding:clamp(120px,16vh,200px) clamp(20px,6vw,96px) clamp(140px,18vh,220px);text-align:center}
.fecho .wrap{max-width:820px;margin:0 auto;display:block}
.fecho .eyebrow{margin-bottom:26px}
.fecho h2{margin-bottom:40px}
.fecho .lead{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(22px,2.4vw,34px);line-height:1.4;color:var(--ink);text-wrap:pretty}
.fim{display:flex;justify-content:center;padding:0 0 80px}

/* movimento: Apple, contido */
.js .rv{opacity:0;transform:translateY(22px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.js .rv.in{opacity:1;transform:none}
.js .stag>*{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js .stag.in>*{opacity:1;transform:none}
.js .cover h1 .l span{transform:translateY(105%);transition:transform 1.4s var(--ease)}
.js .cover.in h1 .l span{transform:none}
.js .cover .k,.js .cover .sub,.js .cover .hint{opacity:0;transform:translateY(12px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.js .cover.in .k,.js .cover.in .sub,.js .cover.in .hint{opacity:1;transform:none}
.js .cover.in .rule{width:min(360px,50%)}
.js .cover .arcs circle{stroke-dasharray:1;stroke-dashoffset:1;pathLength:1;transition:stroke-dashoffset 2.4s var(--ease)}
.js .cover.in .arcs circle{stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.js .rv,.js .stag>*,.js .cover h1 .l span,.js .cover .k,.js .cover .sub,.js .cover .hint,.js .cover .arcs circle{opacity:1!important;transform:none!important;transition:none!important;stroke-dashoffset:0!important}.js .cover .rule{width:min(360px,50%)!important}.cover .hint b{animation:none}}

@media (max-width:900px){
  .sec .wrap{grid-template-columns:1fr;gap:28px}
  .hd{position:static}
  .rows li{grid-template-columns:40px 1fr;gap:14px;padding:24px 0}
  .f-row{flex-direction:column;gap:4px}
  .wm span{display:none}
}
</style>

<div id="prog" aria-hidden="true"></div>
<header class="bar" id="bar">
  <a class="wm" href="#topo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="12" r="6.5" opacity=".5"/><circle cx="12" cy="12" r="2" opacity=".3"/></svg><span>Radar Urbano</span></a>
  <button class="ix-btn" id="ixBtn" aria-controls="ix" aria-expanded="false"><i></i>Índice</button>
</header>
<nav class="ix" id="ix" aria-label="Índice do dossiê"><div class="ix-grid">
{{INDICE}}
</div></nav>

<main id="topo">
<section class="cover" id="capa">
  <svg class="arcs" viewBox="0 0 600 600" aria-hidden="true"><circle class="a4" cx="300" cy="300" r="296"/><circle class="a3" cx="300" cy="300" r="222"/><circle class="a2" cx="300" cy="300" r="148"/><circle class="a1" cx="300" cy="300" r="74"/></svg>
  <div class="k">Radar Urbano</div>
  <h1><span class="l"><span>RADAR URBANO: O DOSSIÊ DEFINITIVO</span></span><span class="l"><span>E MANUAL DE GUERRA PARA</span></span><span class="l"><span>DOMINAÇÃO DO VAREJO LOCAL</span></span></h1>
  <p class="sub">{{SUB}}</p>
  <div class="rule"></div>
  <div class="hint"><b></b>Role para começar</div>
</section>

{{CORPO}}

<div class="fim"><a class="wm" href="#topo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="12" r="6.5" opacity=".5"/><circle cx="12" cy="12" r="2" opacity=".3"/></svg><span>Radar Urbano</span></a></div>
</main>

<script>
(function(){
  document.documentElement.classList.add('js');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cover=document.getElementById('capa');
  requestAnimationFrame(function(){requestAnimationFrame(function(){cover.classList.add('in')})});

  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var el=e.target;el.classList.add('in');io.unobserve(el);el.querySelectorAll('.cnt').forEach(conta)})},{rootMargin:'0px 0px -10% 0px',threshold:.1});
  document.querySelectorAll('.rv,.stag').forEach(function(el){io.observe(el)});
  document.querySelectorAll('.stag').forEach(function(el){[].slice.call(el.children).forEach(function(c,i){c.style.transitionDelay=(i*90)+'ms'})});

  function fmt(n,dec){var s=n.toFixed(dec).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return dec?s[0]+','+s[1]:s[0]}
  var feitos=new WeakSet();
  function conta(el){if(feitos.has(el))return;feitos.add(el);var t=parseFloat(el.dataset.t),dec=+el.dataset.dec||0,pre=el.dataset.pre||'',suf=el.dataset.suf||'';if(reduce||isNaN(t))return;var d=1500,t0=null;
    (function passo(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/d),e=1-Math.pow(1-k,4);el.textContent=pre+fmt(t*e,dec)+suf;if(k<1)requestAnimationFrame(passo)})(performance.now())}

  var prog=document.getElementById('prog'),bar=document.getElementById('bar');
  var links=[].slice.call(document.querySelectorAll('.ix a[data-s]')),secs=links.map(function(a){return document.getElementById(a.dataset.s)}).filter(Boolean);
  function onScroll(){var h=document.documentElement,max=h.scrollHeight-h.clientHeight;prog.style.width=(max>0?h.scrollTop/max*100:0)+'%';bar.classList.toggle('on',h.scrollTop>40);
    var y=h.scrollTop+h.clientHeight*.4,cur=null;secs.forEach(function(s){if(s.offsetTop<=y)cur=s});links.forEach(function(a){a.classList.toggle('on',!!cur&&a.dataset.s===cur.id)})}
  addEventListener('scroll',onScroll,{passive:true});onScroll();

  var btn=document.getElementById('ixBtn'),ix=document.getElementById('ix');
  function set(o){document.body.classList.toggle('ix',o);btn.setAttribute('aria-expanded',String(o));[].slice.call(ix.querySelectorAll('a')).forEach(function(a,i){a.style.transitionDelay=o?(40+i*10)+'ms':'0ms'})}
  btn.addEventListener('click',function(){set(!document.body.classList.contains('ix'))});
  ix.addEventListener('click',function(e){if(e.target.closest('a'))set(false)});
  addEventListener('keydown',function(e){if(e.key==='Escape')set(false)});
})();
</script>
